name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - codex/jan-approval-recovery

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify protected content
        run: npm run verify:content

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
